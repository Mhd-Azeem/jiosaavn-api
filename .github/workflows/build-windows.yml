name: Build and Release AzDroid

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ps2exe
        shell: powershell
        run: Install-Module ps2exe -Scope CurrentUser -Force

      - name: Build AzDroid EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Invoke-ps2exe .\src\AzApkRunner.ps1 .\dist\AzDroid.exe -noConsole -title 'AzDroid' -product 'AzDroid Android APK Runner' -version '0.2.0'
          Set-Content .\dist\README.txt "AzDroid v0.2.0. Requires QEMU in C:\Program Files\qemu and ADB from Android Studio platform-tools or bundled runtime. Select Android-x86 ISO, choose Create / Install Phone once, then use Start Android. Select APK > Install APK installs through ADB."

      - name: Package
        shell: powershell
        run: Compress-Archive -Path .\dist\* -DestinationPath .\AzDroid-v0.2.0.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzDroid-v0.2.0
          path: AzDroid-v0.2.0.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: AzDroid v0.2.0
          target_commitish: main
          body: |
            First Android-x86/QEMU prototype with persistent virtual disk, ISO setup, ADB APK installation, Windows-to-Android file copy, and Home/Back/Recent controls.
          files: AzDroid-v0.2.0.zip
          fail_on_unmatched_files: true
