name: Build AzDroid

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ps2exe
        shell: powershell
        run: Install-Module ps2exe -Scope CurrentUser -Force
      - name: Build AzDroid EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Invoke-ps2exe .\src\AzApkRunner.ps1 .\dist\AzDroid.exe -noConsole -title 'AzDroid' -product 'AzDroid Android APK Runner' -version '0.2.0'
          Set-Content .\dist\README.txt "AzDroid v0.2. QEMU must be installed in C:\Program Files\qemu. Android Studio platform-tools can provide ADB. First select android-x86 ISO and choose Create / Install Phone. Install Android to the virtual disk. Future boots use Start Android. APKs can then be installed with Select APK > Install APK."
      - name: Package
        shell: powershell
        run: Compress-Archive -Path .\dist\* -DestinationPath .\AzDroid-v0.2.0.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AzDroid-v0.2.0
          path: AzDroid-v0.2.0.zip
