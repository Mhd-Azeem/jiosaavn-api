name = "jiosaavn-api"
main = "./src/server.ts"
compatibility_date = "2024-09-28"

[observability]
enabled = true

# Powers GET /api/usage. CF_ACCOUNT_ID is your Cloudflare account ID (Dashboard > Account Home URL).
# CF_API_TOKEN is a secret, not a var — set it with:
#   wrangler secret put CF_API_TOKEN
# The token needs "Account Analytics: Read" permission (create one at
# https://dash.cloudflare.com/?to=/:account/api-tokens).
[vars]
CF_ACCOUNT_ID = ""
DAILY_REQUEST_LIMIT = "100000"

# Secondary, longer-lived cache for low-churn detail responses (song/album/artist/playlist),
# backing the Cache API for the 24h tier. Create it once with:
#   wrangler kv namespace create CACHE_KV
# then replace the placeholder id below with the id it prints. Until a real id is set, the cache
# middleware degrades gracefully to Cache-API-only (the binding is optional at the type level).
[[kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Powers GET /api/videos/search. YOUTUBE_API_KEY is a secret, not a var — set it with:
#   wrangler secret put YOUTUBE_API_KEY
# Get a key at https://console.cloud.google.com/apis/credentials after enabling "YouTube Data
# API v3" for a project. Until it's set, the endpoint responds 503.
