name = "jiosaavn-api"
main = "./src/server.ts"
compatibility_date = "2024-09-28"

[observability]
enabled = true

# Powers GET /api/usage. CF_ACCOUNT_ID is your Cloudflare account ID (Dashboard > Account Home URL).
# CF_API_TOKEN is a secret, not a var — set it with:
#   wrangler secret put CF_API_TOKEN
# The token needs "Account Analytics: Read" permission (create one at
# https://dash.cloudflare.com/?to=/:account/api-tokens).
[vars]
CF_ACCOUNT_ID = ""
DAILY_REQUEST_LIMIT = "100000"
